# The furnace reference case of tests/test_furnace.py: kiln No. 1 of
#   A. Sagastume Gutiérrez, J. B. Cogollos Martínez, C. Vandecasteele, "Energy and exergy
#   assessments of a lime shaft kiln", Applied Thermal Engineering 51 (2013) 273-280,
#   doi:10.1016/j.applthermaleng.2012.07.013.
# A fuel-oil-fired vertical shaft kiln measured over 24 h (section 4). Every number below is the
# paper's (Table 1 mass balance, Table 2 energy balance, Table 4 fuel composition) or derived
# from it as stated; nothing is fitted.
schema: cheme/furnaces/v1
furnaces:
  - id: K-1
    name: Fuel-oil-fired lime shaft kiln (Sagastume Gutiérrez et al. 2013, kiln No. 1)
    kiln_type: other  # a normal (single) shaft kiln fired with oil: BREF "other kilns"
    reaction: calcination-caco3
    feed:
      mass_flow: {value: 3277, unit: kg/h, source: "Sagastume Gutiérrez 2013, Table 1"}
      temperature: {value: 298, unit: K, source: "Sagastume Gutiérrez 2013, Table 2"}
      composition:
        # The paper models limestone as CaCO3 and quicklime as CaO plus residual CaCO3
        # (Table 5 heat capacities, eq. 5); it does not report the impurities.
        fractions: {CaCO3: 1.0}
        provenance: assumed
        source: "Sagastume Gutiérrez 2013, Table 5 and eq. 5: limestone taken as CaCO3"
    conversion:
      # CO2 released = limestone - quicklime = 3277 - 1965 = 1312 kg/h (Table 1, no moisture
      # or dust reported) -> 29.8121 kmol/h of 32.7418 kmol/h CaCO3 fed (M = 44.009, 100.086).
      value: 0.910519
      unit: "1"
      provenance: calculated
      source: "derived from Sagastume Gutiérrez 2013, Table 1: (3277 - 1965) kg/h CO2"
    product_temperature: {value: 550, unit: K, source: "Sagastume Gutiérrez 2013, Table 2"}
    off_gas_temperature: {value: 728, unit: K, source: "Sagastume Gutiérrez 2013, Table 2"}
    calcining_temperature:
      value: 900
      unit: °C
      source: "Sagastume Gutiérrez 2013, section 2 (p. 274): complete calcination at 900 °C"
    fuel:
      ultimate:
        fractions: {C: 0.850, H: 0.077, O: 0.033, N: 0.010, S: 0.030}
        source: "Sagastume Gutiérrez 2013, Table 4 (per kg of fuel)"
      lhv:
        # 2555 kW / 230 kg/h; the paper states no LHV, its fuel input row is LHV times flow
        # (eq. 21)
        value: 39991.3
        unit: kJ/kg
        provenance: calculated
        source: "derived from Sagastume Gutiérrez 2013, Table 2 (2555 kW) and Table 1 (230 kg/h)"
      mass_flow: {value: 230, unit: kg/h, source: "Sagastume Gutiérrez 2013, Table 1"}
      temperature: {value: 298, unit: K, source: "Sagastume Gutiérrez 2013, Table 2"}
    air:
      mass_flow: {value: 3707, unit: kg/h, source: "Sagastume Gutiérrez 2013, Table 1"}
      temperature: {value: 298, unit: K, source: "Sagastume Gutiérrez 2013, Table 2"}
    losses:
      heat: {value: 292, unit: kW, source: "Sagastume Gutiérrez 2013, Table 2 (wall loss)"}
    tolerance:
      # the paper's Table 2 output rows (124 + 763 + 1478 + 292 = 2657 kW) exceed its input
      # total (2555 + 21 + 27 = 2603 kW) by 54 kW: its balance is not known better than that
      value: 54
      unit: kW
