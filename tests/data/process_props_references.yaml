# Independent reference values for the release-1 property method (cheme process props).
#
# Pure fluids and air: NIST Chemistry WebBook, SRD 69, "Thermophysical Properties of Fluid
# Systems" (https://webbook.nist.gov/chemistry/fluid/), which evaluates the reference equations
# of state: nitrogen Span et al. (2000), J. Phys. Chem. Ref. Data 29, 1361; oxygen Schmidt and
# Wagner (1985), Fluid Phase Equilib. 19, 175; air (pseudo-pure, N2 0.7812 / O2 0.2096 / Ar
# 0.0092) Lemmon et al. (2000), J. Phys. Chem. Ref. Data 29, 331.
# The values below were evaluated with CoolProp 8.0.0, which implements these same equations;
# its normal boiling points (N2 77.355 K, O2 90.188 K) and saturated-liquid densities at them
# (N2 806.08 kg/m3, O2 1141.2 kg/m3) agree with the WebBook tables to the digits given there.
# The WebBook could not be queried from the session that wrote this file: anyone may re-read
# the values from the WebBook URLs in `check` below.
#
# N2/O2 mixture: Lemmon et al. (2000) mixture model for N2/O2/Ar (the air model above, fitted
# to the VLE data of the system), evaluated with CoolProp 8.0.0 (HEOS). The WebBook has no
# mixtures.
#
# Tolerances are the claim: a case that fails narrows the claimed range, never the tolerance.

air_density:  # kg/m3, air of the Lemmon composition
  source: NIST WebBook / Lemmon et al. (2000) air, via CoolProp 8.0.0
  tolerance_rel: 0.005
  points:
    - {T: 288.15, P: 101.325, rho: 1.22554}
    - {T: 293.15, P: 101.325, rho: 1.20458}

gas_density:  # kg/m3 above ambient pressure: the claim there is 1 % (PR is +0.6 % for air at 31 bar)
  source: NIST WebBook fluid tables (Span 2000 N2, Schmidt-Wagner 1985 O2; Lemmon 2000 air), via CoolProp 8.0.0
  tolerance_rel: 0.01
  points:
    - {fluid: AIR, T: 313.15, P: 3100.0, rho: 34.6278}
    - {fluid: N2, T: 313.15, P: 900.0, rho: 9.68888}
    - {fluid: O2, T: 313.15, P: 3100.0, rho: 38.6466}

saturation_temperature:  # K at P kPa(a)
  source: NIST WebBook saturation tables (Span 2000 N2, Schmidt-Wagner 1985 O2), via CoolProp 8.0.0
  check: https://webbook.nist.gov/cgi/fluid.cgi?ID=C7727379&Action=Page (N2), ID=C7782447 (O2)
  tolerance_abs: 0.3
  points:
    - {fluid: N2, P: 101.325, T: 77.355}
    - {fluid: N2, P: 130.0, T: 79.533}
    - {fluid: N2, P: 560.0, T: 95.464}
    - {fluid: O2, P: 101.325, T: 90.188}
    - {fluid: O2, P: 130.0, T: 92.641}
    - {fluid: O2, P: 560.0, T: 110.438}

liquid_density:  # kg/m3, saturated liquid
  source: NIST WebBook saturation tables, via CoolProp 8.0.0
  tolerance_rel: 0.015
  points:
    - {fluid: O2, P: 101.325, T: 90.188, rho: 1141.17}
    - {fluid: N2, P: 101.325, T: 77.355, rho: 806.085}
    - {fluid: N2, P: 560.0, T: 95.464, rho: 715.682}

two_phase:  # N2/O2 50/50 mole: bubble and dew temperature (K), vapour fraction (mole) at T_mid
  source: Lemmon et al. (2000) N2/O2/Ar mixture model, via CoolProp 8.0.0 (HEOS)
  tolerance_T_abs: 0.3
  tolerance_vf_abs: 0.03
  points:
    - {x_N2: 0.5, P: 101.325, bubble: 81.474, dew: 85.615, T_mid: 83.5446, vf: 0.5124}
    - {x_N2: 0.5, P: 560.0, bubble: 101.012, dew: 104.381, T_mid: 102.696, vf: 0.5107}
