# Measured vapour-liquid equilibrium of ethanol (1) + water (2) at 101.3 kPa, the reference of
# the DWSIM NRTL benchmark (tests/test_process_simulate_property_package_nrtl.py).
#
# Every value is copied unchanged from the NIST TRC ThermoML archive (IUPAC ThermoML files of
# the papers, retrieved 2026-10-27 from the URLs under `thermoml`), dataset numbers as there:
# x and y are the ethanol mole fractions of the liquid and the vapour, T the boiling
# (equilibrium) temperature in K. U_T and U_y are the combined expanded uncertainties (95 %
# level of confidence) the ThermoML file gives with each value ("propagation of evaluated
# standard uncertainties", evaluated by the data file compiler); they include the effect of
# the composition uncertainty, hence the large U_T where the bubble curve is steep (dilute
# ethanol). The pressure is given as 101.3 kPa (four digits), without an uncertainty.
#
# The two papers are independent measurements (different laboratories and stills). Nothing is
# fitted to them here: DWSIM and thermo use ChemSep's NRTL parameters as they ship them, and
# which data ChemSep fitted those to is not stated with them.

