# Reference data for package syngas-pr-vapor (tests/test_property_packages.py), typed in from the
# publications cited per block. Nothing here is fitted or estimated by cheme-as-code.

# Mixture models for ammonia with hydrogen, nitrogen, argon and methane: Neumann, Thol, Bell,
# Lemmon, Span, "Fundamental thermodynamic models for mixtures containing ammonia", Fluid Phase
# Equilibria 511 (2020) 112496, doi:10.1016/j.fluid.2020.112496. The parameters are taken as
# republished in EOS-CG-2021: Neumann, Herrig, Bell, Beckmueller, Lemmon, Thol, Span, Int. J.
# Thermophys. 44 (2023) 178, doi:10.1007/s10765-023-03263-6 (open access): Table 4 (reducing
# parameters, pp. 16-17) and Table 5 (departure functions, pp. 21-22; EOS-CG-2021 corrects the
# parameter labels of Table 8 of the 2020 paper). Pair order i+j as printed; the reducing
# functions are those of GERG-2008 (EOS-CG-2021 Eqs. 5-7) and the terms those of its Eq. 9:
#   exp: n delta^d tau^t exp(-delta^l)
#   GBS: n delta^d tau^t exp(-eta (delta - epsilon)^2 - beta (tau - gamma)^2)
neumann2020:
  source: Neumann et al. 2020 (Fluid Phase Equilib. 511, 112496), parameters as in EOS-CG-2021
    (Int. J. Thermophys. 44, 178, 2023) Tables 4 and 5
  pairs:
    - {i: Hydrogen, j: Ammonia, betaT: 0.988240, gammaT: 1.126600, betaV: 1.010300,
       gammaV: 0.729800, F: 1, departure: H2-NH3}
    - {i: Nitrogen, j: Ammonia, betaT: 1.057512, gammaT: 0.952705, betaV: 0.739937,
       gammaV: 1.447261, F: 0}
    - {i: Methane, j: Ammonia, betaT: 1.022371, gammaT: 0.940156, betaV: 1.006058,
       gammaV: 1.069834, F: 0}
    - {i: Argon, j: Ammonia, betaT: 1.146326, gammaT: 0.998353, betaV: 0.756526,
       gammaV: 1.041113, F: 1, departure: Ar-NH3}
  departure:
    H2-NH3:
      - {type: exp, n: -3.73558, t: 1.28, d: 1, l: 1}
      - {type: exp, n: -7.47092, t: 2.05, d: 2, l: 1}
      - {type: GBS, n: 1.98413, t: 2.6, d: 1, eta: 0.61, beta: 2.06, gamma: 0.79, epsilon: 0.8}
      - {type: GBS, n: 1.87191, t: 3.13, d: 2, eta: 1.6, beta: 1.74, gamma: 2.1, epsilon: 1.62}
    Ar-NH3:
      - {type: exp, n: 0.2350785, t: 2.3, d: 3, l: 1}
      - {type: GBS, n: -1.913776, t: 1.65, d: 1, eta: 1.3, beta: 0.6, gamma: 0.9, epsilon: 0.31}
      - {type: GBS, n: 1.624062, t: 0.42, d: 1, eta: 1.5, beta: 0.5, gamma: 1.5, epsilon: 0.39}

# Measured compressibility factors Z = PV/RT of N2-NH3 and Ar-NH3 gas at 50 degC (323.15 K):
# K. Date, "Studies on the P-V-T relations of fluids at high pressure III. The compressibilities
# of argon-ammonia and nitrogen-ammonia gaseous mixture systems", Rev. Phys. Chem. Jpn. 43(2),
# 63-70 (1973), hdl:2433/46988 (open access, Kyoto University repository). Smoothed values at
# round pressures, Tables 1 and 3; the author states a maximum error of 0.2 % in Z and 0.1 mol%
# in composition. Pressures in atm (101.325 kPa). The 28 atm value of the 87.3 % N2 mixture is
# printed as 0.6626 (a misprint between 0.9931 and 0.9922) and is left out.
date1973:
  source: Date, Rev. Phys. Chem. Jpn. 43(2), 63-70 (1973), Tables 1 and 3
  temperature_K: 323.15
  uncertainty_Z_rel: 0.002
  mixtures:
    - x: {N2: 0.873, NH3: 0.127}
      Z: {2: 0.9994, 4: 0.9988, 6: 0.9982, 8: 0.9976, 10: 0.9971, 12: 0.9965, 14: 0.9960,
          16: 0.9955, 18: 0.9950, 20: 0.9944, 22: 0.9940, 24: 0.9935, 26: 0.9931, 30: 0.9922,
          40: 0.9903, 50: 0.9886}
    - x: {N2: 0.770, NH3: 0.230}
      Z: {2: 0.9984, 4: 0.9968, 6: 0.9952, 8: 0.9937, 10: 0.9922, 12: 0.9908, 14: 0.9894,
          16: 0.9880, 18: 0.9867, 20: 0.9854, 22: 0.9842, 24: 0.9830, 26: 0.9818, 28: 0.9807,
          30: 0.9796}
    - x: {N2: 0.623, NH3: 0.377}
      Z: {2: 0.9965, 4: 0.9930, 6: 0.9896, 8: 0.9865, 10: 0.9834, 12: 0.9805, 14: 0.9777,
          16: 0.9751, 18: 0.9725, 20: 0.9701}
    - x: {AR: 0.918, NH3: 0.082}
      Z: {2: 0.9985, 4: 0.9973, 6: 0.9960, 8: 0.9949, 10: 0.9937, 12: 0.9925, 14: 0.9915,
          16: 0.9904, 18: 0.9894, 20: 0.9883, 22: 0.9872, 24: 0.9863, 26: 0.9854, 28: 0.9845,
          30: 0.9836, 40: 0.9798, 50: 0.9767}
    - x: {AR: 0.839, NH3: 0.161}
      Z: {2: 0.9981, 4: 0.9964, 6: 0.9947, 8: 0.9931, 10: 0.9916, 12: 0.9900, 14: 0.9885,
          16: 0.9870, 18: 0.9855, 20: 0.9840, 22: 0.9826, 24: 0.9812, 26: 0.9800, 28: 0.9786,
          30: 0.9773, 40: 0.9714, 50: 0.9663}
    - x: {AR: 0.635, NH3: 0.365}
      Z: {2: 0.9962, 4: 0.9925, 6: 0.9888, 8: 0.9852, 10: 0.9816, 12: 0.9780, 14: 0.9744,
          16: 0.9708, 18: 0.9674, 20: 0.9640, 22: 0.9606, 24: 0.9572, 26: 0.9538, 28: 0.9505,
          30: 0.9471}
  # the Neumann et al. model reproduces these within (largest deviation: Ar 63.5 % at 30 atm)
  reference_tolerance_rel: 0.006

# Measured densities of a hydrogen-carbon dioxide-methane gas at 673.1 K, above the 625 K of the
# methane reference equation: Cheng, Shang, Ma, Jin, Sakoda, Zhang, Guo, "Density data of two
# (H2 + CO2) mixtures and a (H2 + CO2 + CH4) mixture by a modified Burnett method at temperature
# 673 K and pressures up to 25 MPa", J. Chem. Eng. Data 64(4), 1693-1704 (2019),
# doi:10.1021/acs.jced.8b01206. Values from the NIST TRC ThermoML archive file of the paper
# (https://trc.nist.gov/ThermoML/10.1021/acs.jced.8b01206.xml, data set 5): pressure kPa,
# amount density mol/m3 and its expanded uncertainty (95 %) mol/m3.
cheng2019:
  source: Cheng et al., J. Chem. Eng. Data 64, 1693 (2019), via NIST ThermoML
  temperature_K: 673.1
  x: {H2: 0.6026, CO2: 0.1948, CH4: 0.2026}
  points:
    - [22010, 3710, 40]
    - [12920, 2230, 20]
    - [7668, 1340, 11]
    - [4580, 807, 6]
    - [2746, 487, 3]
    - [1651, 293.6, 1.9]
    - [993, 177.1, 1.1]
    - [598, 106.9, 0.6]
  # GERG-2008 (methane's reference equation extrapolated) reproduces these within the expanded
  # uncertainty plus this margin
  reference_margin_rel: 0.002
