        source: run-100-1
      - id: R2
        voltage: {value: 3.34}
        outlet_flow: 20.44
        fractions: {CO: {value: 12.44, unit: mol%}, H2: {value: 3.580, unit: mol%}, CO2: {value: 83.98, unit: mol%}}
        titration: {V0: 10.000, V1: 9.834, V2: 9.920}
