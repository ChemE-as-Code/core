# A SYNTHETIC measured series of a 5 cm2 reverse-bias bipolar-membrane CO2 electrolysis cell
# (tests only). The numbers are made up to exercise the processing: FE(CO) 0.6-0.8, FE(H2)
# 0.15-0.33, water dissociation efficiency 0.8-0.97, rounded as a lab notebook would; they are
# not taken from any publication. The CO2 fed (20 sccm) leaves as CO2, CO and carbonate in the
# anolyte, so the carbon balance closes to the rounding.
schema: cheme/electrochemical-measurements/v1
kind: electrochemical_measurements
id: synthetic-bpm
title: Synthetic rBPM CO2 electrolysis series
provenance: given
source: "synthetic test data (tests/data/electrochemical/co2-bpm)"
licence: "CC0 (synthetic)"
cell:
  active_area: {value: 5, unit: cm2}
  temperature: {value: 25, unit: °C}
  electrolyte: {name: 1 M KOH, concentration: {value: 1, unit: mol/L}}
  membrane: {kind: bipolar, bias: reverse, name: synthetic BPM}
voltage_basis: cell
products:
  - {id: CO, electrons: 2, electrode: cathode, reaction: CO2R, thermoneutral_voltage: {value: 1.46644, unit: V}}
  - {id: H2, electrons: 2, electrode: cathode, reaction: WS, thermoneutral_voltage: {value: 1.48121, unit: V}}
gas:
  flow_unit: sccm
  standard_conditions:
    temperature: {value: 273.15, unit: K}
    pressure: {value: 101.325, unit: kPa}
  flow_position: outlet
  flow_correction: {factor: 1.0, source: "synthetic: the meter is calibrated on the outlet mixture"}
  inlet: {component: CO2, flow: 20}
titration:
  method: warder-double-endpoint
  titrant_concentration: {value: 0.1, unit: mol/L}
  anolyte_volume: {value: 90, unit: mL}
  aliquot_volume: {value: 1, unit: mL}
points:
  - id: P050
    current_density: {value: 50, unit: mA/cm2}
    duration: {value: 3600, unit: s}
    replicates:
      - id: R1
        voltage: {value: 2.90}
        outlet_flow: 19.89
        fractions: {CO: {value: 7.01, unit: mol%}, H2: {value: 1.314, unit: mol%}, CO2: {value: 91.68, unit: mol%}}
        titration: {V0: 10.000, V1: 9.813, V2: 9.925}
        source: run-050-1
      - id: R2
        voltage: {value: 2.94}
        outlet_flow: 19.85
        fractions: {CO: {value: 6.85, unit: mol%}, H2: {value: 1.405, unit: mol%}, CO2: {value: 91.75, unit: mol%}}
        titration: {V0: 10.000, V1: 9.793, V2: 9.921}
        source: run-050-2
  - id: P100
    current_density: {value: 100, unit: mA/cm2}
    duration: {value: 3600, unit: s}
    replicates:
      - id: R1
        voltage: {value: 3.30}
        outlet_flow: 20.45
