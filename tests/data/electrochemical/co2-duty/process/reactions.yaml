# The overall reactions of the cell, with the anode's oxygen evolution: CO2 reduction to CO
# (n = 2) and hydrogen evolution (n = 2). Heats of reaction at 298.15 K from the CODATA Key
# Values for Thermodynamics (Cox, Wagman, Medvedev, Hemisphere, New York, 1989), kJ/mol:
# dfH(CO2, g) = -393.51 +- 0.13, dfH(CO, g) = -110.53 +- 0.17, dfH(H2O, l) = -285.830 +- 0.040;
# H2 and O2 are reference states.
schema: cheme/reactions/v1
kind: reactions
reactions:
  - id: CO2R
    title: CO2 reduction to CO with oxygen evolution
    equation: CO2 -> CO + 1/2 O2
    stoichiometry: {CO2: -1, CO: 1, O2: 0.5}
    heat_of_reaction:
      value: 282980
      temperature: 298.15
      provenance: given
      source: "CODATA Key Values (Cox, Wagman, Medvedev 1989): dfH(CO, g) - dfH(CO2, g) = -110.53 + 393.51 kJ/mol"
    sources: ["Cox, Wagman, Medvedev, CODATA Key Values for Thermodynamics, Hemisphere, New York (1989)"]
  - id: WS
    title: Water splitting (hydrogen evolution at the cathode)
    equation: H2O(l) -> H2 + 1/2 O2
    stoichiometry: {H2O: -1, H2: 1, O2: 0.5}
    heat_of_reaction:
      value: 285830
      temperature: 298.15
      provenance: given
      source: "CODATA Key Values (Cox, Wagman, Medvedev 1989): dfH(H2O, l) = -285.830 kJ/mol"
    sources: ["Cox, Wagman, Medvedev, CODATA Key Values for Thermodynamics, Hemisphere, New York (1989)"]
