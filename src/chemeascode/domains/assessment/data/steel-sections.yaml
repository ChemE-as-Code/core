# Mass per metre of the steel sections the 3D layout model uses, kg/m: the material take-off
# turns member lengths into tonnage with it. Rolled sections (HEB, HEA, IPE, UPN, equal angles)
# are the nominal masses of the European section tables (EN 10365); hollow sections and flat
# bars the model names without a wall thickness are ASSUMED (the thickness used is given). A
# take-off is a quantity estimate, not a structural design: connections, base plates, bolts
# and coating are not in these masses (the estimate's factors carry them). A section name is
# compared without blanks and in upper case ("HEB 300" is HEB300); "C" is a UPN channel.
