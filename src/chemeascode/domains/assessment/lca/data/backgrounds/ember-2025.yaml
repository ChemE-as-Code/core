# Packaged open background profile ember-2025: life-cycle emissions intensity of electricity
# generation in 2025 for the G20, the EU-27 and its members, Norway, Switzerland and the world
# (Ember, CC BY 4.0). Use it from lca/factors.yaml with `include: [ember-2025]`; ids
# ember-2025:electricity-<iso2>, electricity-eu27, electricity-glo.
#
# Credit Ember with the attribution below (CC BY 4.0: link the licence, say it is modified).
# Generated from Ember's yearly CSV (downloaded 2026-10-25; the URL is not versioned, so the
# checksum pins that copy); each factor names its line. Scope: life cycle (upstream, supply
# chain, manufacturing), generation-based, no T&D losses. Do not mix with the direct-emission
# profiles (egrid-2023, eea-ener038-2024) in one comparison without saying so. Core issue #268.
schema: cheme/lca/v1
kind: lca_factors
sources:
- id: ember-2025
  title: 'Ember Yearly Electricity Data (global): emissions intensity of generation'
  provider: Ember
  version: release of 2026-09-15 (downloaded 2026-10-25), data year 2025
  url: https://ember-energy.org/data/yearly-electricity-data/
  licence: CC-BY-4.0
  attribution: Ember (2026), Yearly Electricity Data (release 2026-09-15), https://ember-energy.org/data/yearly-electricity-data/,
    CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/); subset, converted to kg CO2e/kWh.
  publication: public
  redistribution: true
  geography: GLO
  year: 2025
  method: 'life-cycle GWP100 per technology (UNECE 2022; Jordaan et al. 2022 for gas; IPCC Fifth Assessment
    WG3 Annex III midpoints), upstream methane at GWP 21 (IPCC Second Assessment): no single GWP basis'
  checksum: sha256:91d30fb170dac8a62130f7b39e11ecbb301f902e08400e9561510882eadcd701
  notes: >-
    Life-cycle emissions intensity of electricity generation (Ember methodology v1.6): upstream methane,
    supply chain and manufacturing included, all gases as CO2e over 100 years; per kWh of gross generation
    (net-generation factors adjusted by 6 % for thermal and 1 % for other sources), no imports, no T&D
    losses. Modelled with per-technology factors (gas 2017, coal 2020), not measured; bioenergy at the
    IPCC midpoint for energy crops, by Ember's account a significant underestimate for woody biomass;
    coal CHP counts electricity only. The latest year is partly projected from monthly data and regional
    and world values are estimated: they are revised in later releases. The download URL is not versioned:
    the checksum is of the copy read on 2026-10-25 (release_generation_yearly_global.csv).
categories:
- id: climate-change
  title: Climate change
  unit: kg CO2-eq
  method: life-cycle GWP100 (Ember; mixed basis)
