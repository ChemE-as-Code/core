# Packaged open background profile egrid-2023: US grid electricity at generation, direct
# plant emissions only (total output rate, CO2e, AR5), for the US and its 27 eGRID subregions. Use it from
# lca/factors.yaml with `include: [egrid-2023]`; ids egrid-2023:electricity-us,
# egrid-2023:electricity-us-<subregion> (e.g. electricity-us-erct, location US-ERCT).
#
# Generated from egrid2023_data_rev2.xlsx (US EPA, public domain); each factor names its cell.
# Scope: no T&D losses (US grid gross loss 4.2 %, GGL23), no upstream or construction. For
# electricity at the consumer this understates: state it (proxy:) when a study's baseline counts
# them (e.g. desnz-ghg-2026:electricity-gb includes T&D and well-to-tank). Core issue #268.
schema: cheme/lca/v1
kind: lca_factors
sources:
- id: egrid-2023
  title: Emissions & Generation Resource Integrated Database (eGRID2023), revision 2
  provider: U.S. Environmental Protection Agency (EPA)
  version: eGRID2023 rev2 (data year 2023, released 2025-06-12)
  url: https://www.epa.gov/egrid/download-data
  licence: Public domain in the US (17 U.S.C. 105; https://edg.epa.gov/EPA_Data_License.html; https://www.usa.gov/publicdomain/label/1.0/)
  attribution: U.S. EPA, Emissions & Generation Resource Integrated Database (eGRID2023, rev2, 2025-06-12).
  publication: public
  redistribution: true
  geography: US
  year: 2023
  method: GWP100, IPCC AR5 without climate-carbon feedbacks (CH4 28, N2O 265; eGRID2023 Technical Guide
    of the original 2025-01-15 release)
  checksum: sha256:895cd81dd8662406189ad8adf5a2578dcb362cdb5cff7cca81b10ee6bd2447c6
  notes: >-
    Total output emission rates (SRC2ERTA, USC2ERTA: CO2, CH4, N2O as CO2e per MWh of all net generation,
    nuclear and renewables included; not eGRID's combustion output rate) at the point of generation: no
    transmission and distribution losses, no upstream (pre-combustion) or construction emissions (Technical
    Guide 3.1). Generation mix of the area: imports and exports are not counted, so a subregion that imports
    much can differ from its consumption mix in either direction (EPA publishes consumption-based rates
    separately). CHP emissions are allocated to electricity (thermal output excluded); biogenic CO2 is
    set to zero, biogenic CH4 and N2O remain. Grid gross loss is 4.2 % for the US (GGL23), none is given
    for Puerto Rico (PRMS). File egrid2023_data_rev2.xlsx.
categories:
- id: climate-change
  title: Climate change
  unit: kg CO2-eq
  method: GWP100 (IPCC AR5, eGRID2023)
