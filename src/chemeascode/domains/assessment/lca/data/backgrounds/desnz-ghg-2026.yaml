# Packaged open background profile desnz-ghg-2026: a screening carbon footprint without a
# licensed database. Use it from lca/factors.yaml with `include: [desnz-ghg-2026]`; the factor
# ids below are then prefixed: desnz-ghg-2026:electricity-gb.
#
# The numbers are the UK Government GHG Conversion Factors for Company Reporting 2026 (DESNZ),
# flat file version 1.2 (republished 31 July 2026), "GHG Conversion Factor 2026", kg CO2e. Each
# factor sums the row ids it names. Published under the Open Government Licence v3.0, which
# permits copying, publishing, distributing and adapting with the attribution below; cheme-as-code
# records the terms, it does not grant rights. Climate change only (no other impact category),
# UK geography, GWP100 of AR4/AR5 (methodology Table 1), biogenic CO2 excluded.
schema: cheme/lca/v1
kind: lca_factors
sources:
  - id: desnz-ghg-2026
    title: UK Government GHG Conversion Factors for Company Reporting 2026 (flat file)
    provider: UK Department for Energy Security and Net Zero (DESNZ)
    version: "2026 v1.2 (flat file republished 2026-07-31)"
    url: https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2026
    licence: OGL-3.0
    attribution: "Contains public sector information licensed under the Open Government Licence v3.0 (UK Government GHG Conversion Factors for Company Reporting 2026, DESNZ)."
    publication: public
    redistribution: true
    geography: GB
    year: 2026
    method: "GWP100, IPCC AR4/AR5 (DESNZ 2026 methodology, Table 1)"
    checksum: "sha256:a9a455ab396dae226d510c7be6233748416d490c41a5d20f3dc7a0c45feecd5e"
    notes: >-
      Company-reporting factors, not LCA datasets: electricity and fuels include well-to-tank
      and (electricity) transmission and distribution; material use covers extraction, primary
      processing, manufacture and transport to the point of sale (methodology 12.2) and is not
      suitable for recycling credits (12.1).
