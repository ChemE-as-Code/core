# Packaged open background profile eea-ener038-2024: grid electricity of the EU-27 and its 27
# member states in 2024, direct CO2e emissions per kWh of gross generation (EEA indicator ENER038,
# CC BY under the EEA legal notice; acknowledge the EEA in each copy).
# Use it from lca/factors.yaml with `include: [eea-ener038-2024]`; ids
# eea-ener038-2024:electricity-<iso2> (electricity-de, electricity-nl, ...) and electricity-eu27.
#
# Generated from the indicator's two CSV files (EEA re-use policy, acknowledgement required);
# each factor names its line. Scope: generation, direct emissions only: no T&D losses, no
# upstream, biomass CO2 excluded. Compared with a baseline at the consumer with well-to-tank
# (desnz-ghg-2026:electricity-gb), it understates: state it (proxy:). Core issue #268.
schema: cheme/lca/v1
kind: lca_factors
sources:
- id: eea-ener038-2024
  title: Greenhouse gas emission intensity of electricity generation in Europe (indicator ENER038)
  provider: European Environment Agency (EEA)
  version: ENER038, data 1990-2024, published 2026-07-10
  url: https://www.eea.europa.eu/en/analysis/indicators/greenhouse-gas-emission-intensity-of-1
  licence: 'CC BY (version not stated) under the EEA legal notice (https://www.eea.europa.eu/en/legal-notice):
    re-use, including commercial, with the EEA acknowledged in each copy and the meaning not distorted'
  attribution: 'Source: European Environment Agency (EEA), indicator ENER038 ''Greenhouse gas emission
    intensity of electricity generation in Europe'' (2026), https://www.eea.europa.eu/en/analysis/indicators/greenhouse-gas-emission-intensity-of-1,
    CC BY; values converted from g to kg CO2e per kWh.'
  publication: public
  redistribution: true
  geography: EU27
  year: 2024
  method: GWP100 of the UNFCCC inventories (IPCC AR5 for 2023+ submissions; not stated by the indicator)
  checksum: sha256:7902614b4cbe71d06d813a8cd0edc7e154704a0fc44bfaa5e3f2336baf244774
  notes: >-
    Ratio of CO2e emissions from electricity production to gross electricity generation, nuclear and renewables
    included at zero (indicator methodology). The numerator is inventory category 1A1a (public electricity
    and heat), scaled up for autoproducers by their energy input, with heat split out pro rata. Biomass
    combustion (as CO2e, not only CO2) and upstream emissions are not included. Per kWh of gross generation:
    plants' own use, T&D losses and imports are not counted, so per kWh delivered the intensity would
    be higher. Country values are published as integers (g). Underlying data: inventories reported to
    UNFCCC, Eurostat nrg_bal_c. checksum is of the EU-27 file; country file sha256:0a2668e4d109ca83e62412b94e987df6f5dce967fcc3616d602979b57eb9866e.
categories:
