# Curated elementary-flow crosswalk: the identity of the elementary flows cheme's
# packaged methods, examples and tests use, in reference flow lists. Not a flow list: only these
# flows, extended one at a time with a verified identifier. CAS is an attribute here, never the
# identity: a flow is a substance in a compartment and sub-compartment, with an origin.
#
# Lists:
# - ef-3.1: the EF 3.1 reference package (European Commission, JRC; free reuse with
#   attribution), the primary list. No EF 3.1 UUID is recorded yet: none could be verified
#   offline against the reference package when this file was made, and none is guessed. Every
#   flow's EF 3.1 identity is therefore {list: ef-3.1, uuid: null}, and cheme assess lca
#   reports it (cheme.lca-flow-uuid, info). TODO(#26): add the EF 3.1 UUIDs from the
#   reference package, with its version: scripts/fill_ef31_uuids.py reads them from a downloaded
#   copy of the package (a flow gets an `ef-3.1: {name, unit, uuid, categories}` block by
#   sub-compartment, as biosphere3's), and remove the finding's cause.
# - biosphere3: the ecoinvent elementary exchange list (biosphere3 in Brightway), for
#   Brightway. The UUIDs, names, categories and units below were read from
#   "ecoinvent elementary flows 3.9.xml" (ecoinvent elementary exchanges, EcoSpold02
#   validElementaryExchanges) as distributed with bw2io 0.9.17 (BSD-3-Clause, Copyright (c)
#   2016 Chris Mutel and Paul Scherrer Institut). Only identifiers and names are recorded (no
#   values, no characterisation): facts needed to address the flows, with this attribution.
#   ecoinvent publishes its elementary exchange list for free download; check its current
#   terms before redistributing more of it.
#
# Fields: id (cheme's key), cas, compartment (air, water, soil, resource), origin (fossil,
# biogenic, land-use-change; absent: any), default (false: chosen only by its id, e.g. a water
# source), and per list: name, unit, per_kg (the list unit per kg of the exchange, for flows the
# list counts in m3: water at 1000 kg/m3, the LCI convention), and uuid by sub-compartment
# (sub-compartments as in docs/framework/lca.md; resources: in-air, in-water, in-ground, land).
source:
  biosphere3: "ecoinvent elementary exchanges 3.9 (validElementaryExchanges 3.0.0.49140), via bw2io 0.9.17"
