# Structured scope of uba-strommix-2026 (core#306); the profile file stays byte-stable.
# From the profile notes: direct fossil CO2 only, emitted at generation in Germany over the net
# electricity delivered to end use (line losses loaded onto the delivered kWh), territorial, trade
# balance not applied.
sources:
  uba-strommix-2026:
    basis: direct
    delivery: consumer
    gases: co2
    mix: grid-average
    accounting: generation
    note: "denominator is net electricity to end use: losses are loaded onto the delivered kWh"
