[project]
name = "agent-cli"
version = "0.1.0"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "claude-agent-sdk>=0.2.174",
    "pyyaml>=6.0.3",
    "psutil>=7.0",
]

# Its own pytest root: the repository-wide settings in ../pyproject.toml are for the package.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
