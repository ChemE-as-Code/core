site_name: ChemE-as-Code
site_description: "Plant design as code: DEXPI P&IDs, BFD/PFD and engineering YAML kept in git, checked by cheme."
site_url: https://docs.cheme-as-code.org/
repo_url: https://github.com/ChemE-as-Code/core
repo_name: ChemE-as-Code/core
edit_uri: edit/main/docs/
copyright: Copyright (C) 2026 Artur Schweidtmann. cheme-as-code is licensed under AGPL-3.0-or-later.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - assets/extra.css

# Pages generated or assembled at build time from the code, README.md and the project template.
hooks:
  - docs/hooks/includes.py
  - docs/hooks/reference.py

exclude_docs: |
  hooks/

watch:
  - README.md
  - src/chemeascode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Get started:
      - Install: getting-started/install.md
      - Your first plant: getting-started/first-plant.md
      - The project template: getting-started/project-template.md
