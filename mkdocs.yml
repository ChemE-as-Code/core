      - plant.yaml: concepts/plant-yaml.md
      - Stages and gates: concepts/stages-and-gates.md
      - Provenance: concepts/provenance.md
      - Glossary: concepts/glossary.md
  - Guides:
      - P&IDs and DEXPI: guides/pids.md
      - Editing and generating sheets: guides/editing.md
      - "Process: BFD, PFD and streams": guides/process.md
      - "Furnace energy basis (lime calcination)": framework/furnace.md
