<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="ChemE-as-Code">
  <!-- ChemE-as-Code mark: a P&ID on a glass plate over a cyan slab and "code" tiles.
       Vector redraw of the 2026 brand sheet (logo-source/). Plates are flat rounded squares
       projected isometrically with matrix(1.2 .62 -1.2 .62 128 top). -->
  <defs>
    <linearGradient id="cac-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fcfe"/>
      <stop offset="1" stop-color="#cdeef8"/>
    </linearGradient>
    <linearGradient id="cac-slab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd8ee"/>
      <stop offset="1" stop-color="#0aa8d2"/>
    </linearGradient>
    <linearGradient id="cac-drum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b2350"/>
      <stop offset="1" stop-color="#173f78"/>
    </linearGradient>
  </defs>

  <!-- code tiles, on a plane below the slab: a dense navy band front-left, sparse cyan to the right -->
  <g transform="matrix(1.2 .62 -1.2 .62 128 120)">
    <rect x="2" y="44" width="16" height="16" rx="3" fill="#0b4a8f"/>
    <rect x="2" y="66" width="16" height="16" rx="3" fill="#13609f"/>
    <rect x="2" y="88" width="16" height="16" rx="3" fill="#0b4a8f"/>
    <rect x="24" y="56" width="16" height="16" rx="3" fill="#13609f"/>
    <rect x="24" y="78" width="16" height="16" rx="3" fill="#1872b6"/>
    <rect x="24" y="100" width="15" height="15" rx="3" fill="#2b98cf"/>
    <rect x="46" y="70" width="15" height="15" rx="3" fill="#1872b6"/>
    <rect x="46" y="92" width="14" height="14" rx="3" fill="#2fb0dc"/>
    <rect x="68" y="32" width="14" height="14" rx="3" fill="#3cc4e4"/>
    <rect x="68" y="62" width="13" height="13" rx="3" fill="#2fb0dc"/>
    <rect x="70" y="86" width="11" height="11" rx="2.5" fill="#62d1ec"/>
    <rect x="90" y="46" width="11" height="11" rx="2.5" fill="#62d1ec"/>
    <rect x="92" y="72" width="8" height="8" rx="2" fill="#9be3f3"/>
  </g>

  <!-- cyan slab: side, then top -->
  <rect width="96" height="96" rx="12" transform="matrix(1.2 .62 -1.2 .62 128 62)" fill="#0b8fbd"/>
  <rect width="96" height="96" rx="12" transform="matrix(1.2 .62 -1.2 .62 128 50)" fill="url(#cac-slab)"/>

  <!-- glass plate: edge, then top -->
  <rect width="96" height="96" rx="12" transform="matrix(1.2 .62 -1.2 .62 128 30)" fill="#b9e4f2"/>
  <rect width="96" height="96" rx="12" transform="matrix(1.2 .62 -1.2 .62 128 21)" fill="url(#cac-glass)" stroke="#c2e9f6" stroke-width=".8"/>

  <!-- P&ID: feed line with valve, column with tray stubs, drum -->
  <g transform="translate(0 12)">
  <g fill="none" stroke="#0b2350" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 84h22M84 84h28"/>
    <path d="M56 73v22l28-22v22z" fill="#f7fcfe"/>
    <rect x="112" y="14" width="26" height="104" rx="13" fill="#f7fcfe"/>
    <path d="M138 110h22v-10"/>
  </g>
  <g stroke="#14b4d6" stroke-width="5" stroke-linecap="round">
    <path d="M105 32h7M138 32h8M105 108h7"/>
    <path d="M138 64h16"/>
  </g>
  <path d="M152 58l9 6-9 6z" fill="#14b4d6"/>
  <path d="M162 60a17 15 0 0 1 34 0v32a8 8 0 0 1 -8 8h-18a8 8 0 0 1 -8 -8z" fill="url(#cac-drum)"/>
  <path d="M168 60h22" stroke="#14b4d6" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
