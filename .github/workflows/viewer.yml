name: viewer
# The Vue viewer in viewer/: its own package.json and lock file. It also runs when the API it
# reads changes (cheme serve, the schemas it returns, their tests) or the package metadata does,
# so an API change cannot land without the viewer's tests and the fixture contract.
on:
  pull_request:
    paths:
      - "viewer/**"
      - "src/chemeascode/interfaces/api/**"
      - "src/chemeascode/**/schemas/**"
      - "tests/test_serve*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/viewer.yml"
  push:
    branches: [main]
    paths:
      - "viewer/**"
      - "src/chemeascode/interfaces/api/**"
      - "src/chemeascode/**/schemas/**"
      - "tests/test_serve*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/viewer.yml"
  workflow_dispatch:
concurrency:
  group: viewer-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
defaults:
  run:
    working-directory: viewer
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The lowest Node package.json "engines" allows (jsdom's floor) and the current LTS.
        node-version: ["22.22.2", "24"]
    name: test (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            viewer/playwright-report/
            viewer/test-results/
          retention-days: 7
  api-fixtures:
    # The fixtures the viewer's tests answer /api with are real responses of this commit's
    # cheme serve. The ones made from this repository's examples and test plants are regenerated
    # and must match; the ASU and layout-demo ones come from plants outside this repository and
    # stay as committed (viewer/tests/fixtures/README.md).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - run: uv run python viewer/scripts/regen-fixtures.py
      - name: fixtures match this commit's API
        run: git diff --stat --exit-code -- viewer/tests/fixtures
      # On a mismatch, the fixtures as this commit's API gives them (on Linux, as CI compares):
      # unpack the artifact over viewer/tests/fixtures and commit it after checking the viewer's
      # tests.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: api-fixtures
          path: viewer/tests/fixtures/
          retention-days: 7
  docs:
    # Builds the viewer's MkDocs site to check it (links, includes, nav). Nothing is deployed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: viewer/requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
