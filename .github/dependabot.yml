# Weekly update pull requests, one per ecosystem and folder: the Python dependencies of uv.lock
# (the package), viewer/package-lock.json, agent-cli/uv.lock and the commit-pinned GitHub Actions
# of .github/workflows. pyDEXPI is pinned exactly in pyproject.toml and bumped deliberately
# (ADR 0004), so it is left out.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: pydexpi
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /viewer
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 (the native port) has no JS API; vue-tsc (Volar) needs typescript <7.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: uv
    directory: /agent-cli
    schedule:
      interval: weekly
    groups:
      agent-cli:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
