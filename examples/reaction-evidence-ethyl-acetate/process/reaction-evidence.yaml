conflicts:
  - about: "activation energy and water adsorption term of the esterification on Amberlyst 15"
    observations: [O-KIR-KIN, O-AHM-KIN]
    note: >-
      Ea 104.1 kJ/mol (S-KIR) against 113.9 kJ/mol (S-AHM); KW constant at 3.7 (S-KIR) against
      0.013 to 0.074 depending on temperature (S-AHM); different temperature ranges and fitting
      methods.
    resolution: "neither rate law enters the model yet; the conversion reactor uses O-KIR-CONV"
  - about: "selectivity to ethyl acetate on the non-porous Cu/AlMgO"
    observations: [O-PET-R, O-PET-ABS]
    note: "the abstract gives 20 %, the body 35 % (Sec. 3.2)"

model_basis:
  route: ESTER
  reactions: [ESTERIF]
  catalyst: AMB15
  evidence: [O-KIR-CONV, O-KIR-KIN]
  assumptions:
    - >-
      a conversion reactor at 0.75 of the acetic acid, the batch maximum of O-KIR-CONV at
      ethanol to acid 2:1 and 353 K, taken as the per-pass conversion of a reactor that comes
      close to equilibrium at that feed ratio
    - "no side reactions (not analysed in S-KIR)"
  validation: >-
    check the conversion against the equilibrium constant of O-KIR-KIN at the reactor
    temperature, and against S-CAL once it is read, before the basic stage
  decided_by: illustrative (example)
  date: 2026-10-24
