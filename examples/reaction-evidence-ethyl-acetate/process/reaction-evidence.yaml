routes:
  - id: ESTER
    title: Esterification of acetic acid with ethanol over an acid ion-exchange resin
    equations: ["CH3COOH + C2H5OH <=> CH3COOC2H5 + H2O"]
    reactants: [AcOH, EtOH]
    products: [EtOAc, H2O]
    reactions: [ESTERIF]
    catalysts: [AMB15]
    status: selected
    rationale: >-
      The only route with a rate law and an equilibrium constant among the sources read in
      full; liquid phase below 360 K. Illustrative selection for this example: the criteria
      (feedstock, separation, scale) are the project's to set.
    gaps:
      - "a rate law on a catalyst-mass basis (both kinetics sources lump the catalyst into k)"
      - "the equilibrium constant's temperature dependence (S-KIR takes it as constant)"
      - "side products: S-KIR's analysis covers water, ethanol, ethyl acetate and acetic acid only"
      - "catalyst lifetime beyond three batch runs"
      - "S-CAL (kinetics and reactive distillation) not read"
  - id: DEHYD
    title: Dehydrogenative coupling of ethanol over copper
    equations: ["2 C2H5OH -> CH3COOC2H5 + 2 H2"]
    reactants: [EtOH]
    products: [EtOAc, H2]
    status: candidate
    gaps:
      - "kinetics: S-CAR (LHHW on copper) not read"
      - "selectivity basis (molar or carbon) not defined in S-PET"
      - "the patent examples state no conversion, selectivity or yield"
  - id: ADD
    title: Addition of acetic acid to ethylene over a supported heteropolyacid
    equations: ["C2H4 + CH3COOH -> CH3COOC2H5"]
    reactants: [C2H4, AcOH]
    products: [EtOAc]
    status: candidate
    gaps:
      - "the yield's basis is not defined (Table 1, Run 1: yield 95 above an acetic acid conversion of 66)"
      - "no kinetics found"
      - "whether the pressures are absolute or gauge"
      - "patent examples only: no evidence of industrial performance among the sources read"

observations:
  - id: O-KIR-KIN
    source: S-KIR
    route: ESTER
    location: "p. 573, Eq. 10; p. 575, Eq. 11 and text"
    kind: kinetics
    scale: lab
    equation: "-dCA/dt = k (CA CB - CE CW / K) / (CB + KW CW)"
    conditions:
      temperature: {range: [323, 353], unit: K}
      phase: liquid
      catalyst: AMB15
      catalyst_formulation: "Amberlyst 15, macroporous styrene-DVB (20 %) resin"
      catalyst_loading: {range: [1.0, 10.0], unit: g per 100 g acetic acid,
                         note: "p. 571; the Fig. 3 legend gives 1.08 to 10.8 g"}
      feed:
        AcOH: {range: [0.5, 4], unit: mol per mol EtOH, note: "molar ratio 1:2 to 4:1 (p. 574)"}
      notes: "batch reactor 0.250 dm3, about 900 rpm; no transport limitation (p. 570)"
    kinetics:
      equation: "rA = 2.6e14 exp(-104129/RT) (CA CB - CE CW / K) / (CB + 3.7 CW)"
      rate_basis: "volume of liquid (-dCA/dt, concentrations in mol/dm3); the solid acid's concentration is lumped into k (p. 573)"
      parameters:
        Ea: {value: 104129, unit: kJ/kmol}
        A: {value: 2.6e14, unit: "(m3)2 kmol-2 s-1",
            note: "as printed; not dimensionally consistent with Eq. 11"}
        KW: {value: 3.7, unit: "1", note: "no unit given"}
        K: {value: 4.0, uncertainty: 0.2, unit: "1",
            note: "at 353 K on mole fractions, taken as independent of temperature"}
      temperature_range: {range: [323, 353], unit: K}
      fitting: "batch data at 323 to 353 K; mole fractions instead of activities (p. 575)"
    missing:
      - rate law per kg of catalyst
      - consistent units of the frequency factor
  - id: O-KIR-CONV
    source: S-KIR
    route: ESTER
    location: "p. 574"
    kind: experiment
    scale: lab
    conditions:
      temperature: {value: 353, unit: K}
      phase: liquid
      catalyst: AMB15
      catalyst_loading: {value: 5.4, unit: g per 100 g acetic acid}
      feed:
        AcOH: {value: 0.5, unit: mol per mol EtOH, note: "M = 1/2"}
    conversion:
      - component: AcOH
        value: {value: 0.75, unit: "1", uncertainty: 0.05,
                note: "'approximately 0.75'; reproducibility about 5 % of conversion"}
        basis: equilibrium
    missing:
      - reaction time to the maximum conversion
      - by-products (not analysed)
      - selectivity and yield
    notes: "batch maximum; activity fell about 5 % in conversion over three runs (p. 574)"
  - id: O-AHM-KIN
    source: S-AHM
    route: ESTER
    location: "p. 47, Eq. 1; p. 50, Table 2 and text"
    kind: kinetics
    scale: lab
    equation: "-rA = k CA CB / (CB + KW CW)"
    conditions:
      temperature: {range: [40, 70], unit: °C}
      phase: liquid
      catalyst: AMB15
      catalyst_formulation: "Amberlyst 15 (Sigma-Aldrich), granules 0.600 to 0.850 mm"
      feed:
        AcOH: {range: [0.5, 2], unit: mol per mol EtOH}
      notes: "500 ml batch flask, 250 rpm; no transport limitation assumed (p. 46)"
    kinetics:
      equation: "-rA = k CA CB / (CB + KW CW), k and KW Arrhenius in T"
      rate_basis: "volume of liquid; catalyst mass lumped into k; mole fractions"
      parameters:
        Ea: {value: 113876.9, unit: kJ/kmol, note: "the conclusion (p. 51) prints the same number in kJ/mol"}
        A: {value: 5.9e15, unit: not stated}
        dH_ads_water: {value: -49474.95, unit: kJ/kmol}
      temperature_range: {range: [40, 70], unit: °C}
      fitting: "initial rates, linearised (p. 47)"
    missing:
      - equilibrium constant
      - rate law per kg of catalyst
    notes: "Table 2's k rises 17-fold from 40 to 50 °C, more than the fitted Ea implies"
  - id: O-AHM-CONV
    source: S-AHM
    route: ESTER
    location: "Abstract; p. 48; Conclusion, p. 50-51"
