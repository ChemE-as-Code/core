# Reaction evidence for ethyl acetate (schema cheme/reaction-evidence/v1, skills
# reaction-evidence-search and route-selection). Every number below was read in the full text
# of its source at the location given; values the sources do not state are listed under
# missing. The route selection is illustrative: it shows the handoff, not a recommendation.
# `cheme chemistry evidence` prints the route comparison.
schema: cheme/reaction-evidence/v1
kind: reaction-evidence
product: EtOAc
question: >-
  Routes to ethyl acetate for a concept study: which route, catalyst and operating window
  the literature and patents support, and which reaction model the first flowsheet can use.

searches:
  - {query: "kinetics esterification acetic acid ethanol Amberlyst 15 open access rate equation activation energy",
     tool: web search, date: 2026-10-24, found: [S-AHM]}
  - {query: "Kirbaslar Baykal Dramur Esterification of Acetic Acid with Ethanol Catalysed by an Acidic Ion-Exchange Resin",
     tool: web search, date: 2026-10-24, found: [S-KIR],
     notes: "the journal host did not resolve (DNS); full text read from the Internet Archive copy"}
  - {query: "Calvar Gonzalez Dominguez 2007 esterification acetic acid ethanol reactive distillation doi",
     tool: web search, date: 2026-10-24, found: [S-CAL]}
  - {query: "ethanol dehydrogenation ethyl acetate copper catalyst selectivity open access",
     tool: web search, date: 2026-10-24, found: [S-PET, S-DAVY]}
  - {query: "Santacesaria 2012 Chemical Engineering Journal ethyl acetate ethanol dehydrogenation copper chromite kinetics doi",
     tool: web search, date: 2026-10-24, found: [S-SAN, S-CAR]}
  - {query: "ethylene acetic acid ethyl acetate heteropolyacid silica patent example",
     tool: web search, date: 2026-10-24, found: [S-BP]}

