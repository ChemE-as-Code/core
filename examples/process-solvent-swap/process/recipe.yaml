# The batch recipe of the solvent swap (schema cheme/recipe/v1): one unit, the still. The swap
# takes its boil-up time from ST1's model (distil, from: ST1); the others are illustrative
# durations. `cheme process recipe` gives the cycle time, the batches per year and the
# year-average rate of the batch stream, which must match the flowsheet's S1.
schema: cheme/recipe/v1
kind: recipe
title: Solvent swap
batch_size: {value: 2633, unit: kg, stream: S1, provenance: assumed, source: "the still's charge: illustrative"}
hours_per_year: {value: 7920, provenance: assumed, source: "330 days of 24 h"}
unit_procedures:
  - id: SWAP
    unit: ST1
    title: Solvent swap in ST1
    operations:
      - {id: charge, kind: charge, title: Charge the methanol solution, duration: {value: 1, provenance: assumed}}
      - {id: heat, kind: heat, title: Heat to the boil under vacuum, duration: {value: 1, provenance: assumed}}
      - {id: swap, kind: distil, title: Distil down and swap to toluene, from: ST1}
      - {id: transfer, kind: transfer, title: Pump to the crystallizer, duration: {value: 30, unit: min, provenance: assumed}}
      - {id: clean, kind: clean, title: Rinse, duration: {value: 1, provenance: assumed}}
