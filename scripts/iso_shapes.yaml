# The ISO 10628-2 symbols cheme-as-code ships: input of scripts/import_iso_shapes.py.
#
# Each entry: `source` (the symbol's name in the source catalogue), `name` (the catalogue name
# in cheme-as-code, ending in _SHAPE), `meaning`, `size` (longest side in mm at scale 1),
# `scale` (how big to draw it on an A3 sheet), optional `inline: true` (a piping component,
# drawn in the piping colour) and `classes` (the DEXPI classes it is the default symbol for in
# `cheme fragment equipment`/`valve`; a class the DEXPI reference already draws keeps the
# reference's shape) and `template: true` (also in the P&ID template's empty-sheet.xml;
# the others are added to a sheet's catalogue on first use). An optional `iso` overrides the
# registration number of the source annotations where those are wrong; its comment gives the
# evidence.

# -- pumps and gas movers (15 mm, as the reference's centrifugal pump) -------------------------
- {source: PumpGeneric, name: PUMP_SHAPE, meaning: "pump, general", size: 15, scale: "1.0 (15 mm circle)"}
- {source: PumpCentrifugalShape_1, name: PUMP_CENTRIFUGAL_SHAPE, meaning: "pump, centrifugal", size: 15, scale: "1.0 (15 mm circle)"}
# The annotations give X8095, the diaphragm pump's number; the reciprocating piston pump is X8094
# (DEXPI 2.0.1 reference RECIPROCATING_PUMP_SHAPE, and Wikimedia Commons "Pump, reciprocating
# piston type (ISO 10628-2).svg").
- {source: PumpReciprocatingShape_1, name: PUMP_RECIPROCATING_SHAPE, meaning: "pump, reciprocating (piston)", size: 15, scale: "1.0 (15 mm circle)", iso: X8094}
- {source: PumpGear, name: PUMP_GEAR_SHAPE, meaning: "pump, gear (rotary)", size: 15, scale: "1.0 (15 mm circle)", classes: [RotaryPump]}
- {source: PumpScrewShape_1, name: PUMP_SCREW_SHAPE, meaning: "pump, screw", size: 15, scale: "1.0 (15 mm circle)"}
- {source: PumpProgressiveCavityShape_1, name: PUMP_PROGRESSIVE_CAVITY_SHAPE, meaning: "pump, progressive cavity (eccentric screw)", size: 15, scale: "1.0 (15 mm circle)"}
- {source: PumpDiaphragm, name: PUMP_DIAPHRAGM_SHAPE, meaning: "pump, diaphragm", size: 15, scale: "1.0 (15 mm circle)"}
- {source: PumpVacuum, name: PUMP_VACUUM_SHAPE, meaning: "vacuum pump", size: 15, scale: "1.0 (15 mm circle)"}
- {source: EjectorShape_1, name: EJECTOR_SHAPE, meaning: "ejector or jet pump: motive inlet left, suction below, discharge right", size: 20, scale: "1.0 (20 x 8 mm)", classes: [EjectorPump, AirEjector]}
- {source: CompressorGeneric, name: COMPRESSOR_SHAPE, meaning: "compressor, general", size: 15, scale: "1.0 (15 mm circle); 1.5 for a main air compressor", classes: [Compressor]}
- {source: CompressorCentrifugal, name: COMPRESSOR_CENTRIFUGAL_SHAPE, meaning: "compressor, centrifugal", size: 15, scale: "1.0 (15 mm circle); 1.5 for a main air compressor", classes: [CentrifugalCompressor], template: true}
- {source: CompressorReciprocating, name: COMPRESSOR_RECIPROCATING_SHAPE, meaning: "compressor, reciprocating (piston)", size: 15, scale: "1.0 (15 mm circle)", classes: [ReciprocatingCompressor]}
- {source: CompressorRotary, name: COMPRESSOR_ROTARY_SHAPE, meaning: "compressor, rotary", size: 15, scale: "1.0 (15 mm circle)", classes: [RotaryCompressor]}
- {source: CompressorScrewShape_1, name: COMPRESSOR_SCREW_SHAPE, meaning: "compressor, screw", size: 15, scale: "1.0 (15 mm circle)"}
- {source: CompressorLiquidRingShape_1, name: COMPRESSOR_LIQUID_RING_SHAPE, meaning: "compressor or vacuum pump, liquid ring", size: 15, scale: "1.0 (15 mm circle)"}
- {source: CompressorTurbo, name: COMPRESSOR_TURBO_SHAPE, meaning: "compressor, turbo", size: 15, scale: "1.0 (15 mm circle)"}
- {source: BlowerGeneric, name: BLOWER_SHAPE, meaning: "blower", size: 15, scale: "1.0 (15 mm circle)", classes: [Blower, CentrifugalBlower, AxialBlower], template: true}
- {source: FanGeneric, name: FAN_SHAPE, meaning: "fan", size: 15, scale: "1.0 (15 x 3 mm)", classes: [Fan, RadialFan, AxialFan]}
# The annotations give 2517 (next to the heat exchangers' X2511-X2517); the general turbine is
# 2571 (Wikimedia Commons "Turbine (general) (ISO 10628-2).svg").
- {source: TurbineGeneric, name: TURBINE_SHAPE, meaning: "turbine or expander: narrow inlet left, wide outlet right", size: 15, scale: "1.0 (9 x 15 mm); mirror for flow right to left", classes: [Turbine, GasTurbine, SteamTurbine], template: true, iso: "2571"}
- {source: MotorElectricGenericShape_1, name: MOTOR_SHAPE, meaning: "electric motor (drive)", size: 10, scale: "1.0 (10 mm circle)", classes: [Motor, AlternatingCurrentMotor]}

