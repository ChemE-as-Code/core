# The curated source of the reaction library (src/chemeascode/domains/chemistry/library/).
# scripts/build_reaction_library.py adds each component's molar mass, ideal-gas data and critical
# constants from chemicals and writes one file per process. Edit this file, never the generated
# ones. Catalyst windows are typical industrial ranges (provenance assumed): confirm them with the
# licensor's or vendor's data. A heat_of_reaction is given only where a literature value is known;
# the build checks it against the formation data (cheme validate's 2 % rule). A reaction shared
# by entries (WGS) is the same everywhere: its catalyst is named on the reactor step.
# model_basis says which reactor model an entry's own data supports (stoichiometry_only,
# conversion_selectivity, equilibrium, kinetic; reaction_library.py checks it against the data):
# never stronger than the data; add conversions or rate laws only with a source.
components:
  N2: {name: Nitrogen, cas: 7727-37-9, formula: N2}
  H2: {name: Hydrogen, cas: 1333-74-0, formula: H2}
  NH3: {name: Ammonia, cas: 7664-41-7, formula: NH3}
  AR: {name: Argon, cas: 7440-37-1, formula: Ar}
  CH4: {name: Methane, cas: 74-82-8, formula: CH4}
  H2O: {name: Water, cas: 7732-18-5, formula: H2O}
  CO: {name: Carbon monoxide, cas: 630-08-0, formula: CO}
  CO2: {name: Carbon dioxide, cas: 124-38-9, formula: CO2}
  CH3OH: {name: Methanol, cas: 67-56-1, formula: CH4O}
  O2: {name: Oxygen, cas: 7782-44-7, formula: O2}
  C2H4: {name: Ethylene, cas: 74-85-1, formula: C2H4}
  EO: {name: Ethylene oxide, cas: 75-21-8, formula: C2H4O}
  SO2: {name: Sulfur dioxide, cas: 7446-09-5, formula: SO2}
  SO3: {name: Sulfur trioxide, cas: 7446-11-9, formula: SO3}
  "NO": {name: Nitric oxide, cas: 10102-43-9, formula: "NO"}
  NO2: {name: Nitrogen dioxide, cas: 10102-44-0, formula: NO2}
  H2S: {name: Hydrogen sulfide, cas: 7783-06-4, formula: H2S}
  S2: {name: Disulfur (gas), cas: 23550-45-0, formula: S2}
  C8H18: {name: n-Octane, cas: 111-65-9, formula: C8H18}
  C4H4S: {name: Thiophene, cas: 110-02-1, formula: C4H4S}
  C4H10: {name: n-Butane, cas: 106-97-8, formula: C4H10}
  EB: {name: Ethylbenzene, cas: 100-41-4, formula: C8H10}
  STY: {name: Styrene, cas: 100-42-5, formula: C8H8}
  C3H6: {name: Propylene, cas: 115-07-1, formula: C3H6}
  ACN: {name: Acrylonitrile, cas: 107-13-1, formula: C3H3N}
  H2O2: {name: Hydrogen peroxide, cas: 7722-84-1, formula: H2O2}
  PO: {name: Propylene oxide, cas: 75-56-9, formula: C3H6O}
  C2H6: {name: Ethane, cas: 74-84-0, formula: C2H6}
  C3H8: {name: Propane, cas: 74-98-6, formula: C3H8}
  EDC: {name: "1,2-Dichloroethane", cas: 107-06-2, formula: C2H4Cl2}
  VCM: {name: Vinyl chloride, cas: 75-01-4, formula: C2H3Cl}
  HCL: {name: Hydrogen chloride, cas: 7647-01-0, formula: HCl}
  CL2: {name: Chlorine, cas: 7782-50-5, formula: Cl2}
  HCHO: {name: Formaldehyde, cas: 50-00-0, formula: CH2O}
  MA: {name: Maleic anhydride, cas: 108-31-6, formula: C4H2O3}
  BZ: {name: Benzene, cas: 71-43-2, formula: C6H6}
  CUM: {name: Cumene, cas: 98-82-8, formula: C9H12}
  IB: {name: Isobutene, cas: 115-11-7, formula: C4H8}
  MTBE: {name: Methyl tert-butyl ether, cas: 1634-04-4, formula: C5H12O}
  HCN: {name: Hydrogen cyanide, cas: 74-90-8, formula: CHN}

ullmann: &ullmann "Ullmann's Encyclopedia of Industrial Chemistry (Wiley-VCH), article on the product"
twigg: &twigg "Twigg (ed.), Catalyst Handbook, 2nd ed., Manson (1989)"

entries:
  ammonia:
    title: Ammonia synthesis (Haber-Bosch)
    model_basis: {kind: equilibrium}
    window: {temperature: [643.15, 803.15], pressure: [10000, 35000]}
    reactions:
      - id: NH3_SYN
        equation: N2 + 3 H2 <=> 2 NH3
        stoichiometry: {N2: -1, H2: -3, NH3: 2}
        reversible: true
        heat_of_reaction: {value: -91800, provenance: given, source: "2 x dHf(NH3, g), NIST WebBook"}
        catalyst: FE_NH3
    catalysts:
      - id: FE_NH3
        name: Promoted iron (fused magnetite)
        active_phase: Fe (reduced Fe3O4)
        promoters: [K2O, Al2O3, CaO]
        window: {temperature: [643.15, 803.15], pressure: [10000, 35000]}
        poisons: [H2O, CO, CO2, O2, H2S, sulfur compounds, chlorides]
      - id: RU_NH3
        name: Ruthenium on graphitised carbon
        active_phase: Ru
        promoters: [Ba, Cs]
        support: graphitised carbon
        window: {temperature: [623.15, 773.15], pressure: [7000, 11000]}
        poisons: [H2O, CO, O2, sulfur compounds]
    sources: [*ullmann]

  methanol:
    title: Methanol synthesis (low pressure)
    model_basis: {kind: equilibrium}
    window: {temperature: [493.15, 553.15], pressure: [5000, 10000]}
    reactions:
      - id: MEOH_CO
        equation: CO + 2 H2 <=> CH3OH
        stoichiometry: {CO: -1, H2: -2, CH3OH: 1}
        reversible: true
        heat_of_reaction: {value: -90600, provenance: given, source: "standard enthalpies of formation, 298 K"}
        catalyst: CU_ZNO
      - id: MEOH_CO2
        equation: CO2 + 3 H2 <=> CH3OH + H2O
        stoichiometry: {CO2: -1, H2: -3, CH3OH: 1, H2O: 1}
        reversible: true
        heat_of_reaction: {value: -49400, provenance: given, source: "standard enthalpies of formation, 298 K"}
        catalyst: CU_ZNO
      - &wgs
        id: WGS
        equation: CO + H2O <=> CO2 + H2
        stoichiometry: {CO: -1, H2O: -1, CO2: 1, H2: 1}
        reversible: true
        heat_of_reaction: {value: -41200, provenance: given, source: "standard enthalpies of formation, 298 K"}
    catalysts:
      - id: CU_ZNO
        name: Copper-zinc oxide on alumina
        active_phase: Cu
        promoters: [ZnO, Al2O3]
        window: {temperature: [473.15, 573.15], pressure: [5000, 10000]}
        poisons: [H2S, sulfur compounds, chlorides, carbonyls]
    sources: [*ullmann]

  steam_reforming:
    title: Steam methane reforming
    model_basis: {kind: equilibrium}
    window: {temperature: [723.15, 1223.15], pressure: [1500, 4000]}
    reactions:
      - id: SMR
        equation: CH4 + H2O <=> CO + 3 H2
        stoichiometry: {CH4: -1, H2O: -1, CO: 1, H2: 3}
        reversible: true
        heat_of_reaction: {value: 206100, provenance: given, source: "standard enthalpies of formation, 298 K"}
        catalyst: NI_REF
      - *wgs
    catalysts:
      - id: NI_REF
        name: Nickel reforming catalyst
        active_phase: Ni
        promoters: [K2O]
        support: alpha-Al2O3 or calcium aluminate
        window: {temperature: [723.15, 1223.15], pressure: [1500, 4000]}
        poisons: [H2S, sulfur compounds, chlorides]
    sources: [*ullmann, *twigg]

  ht_shift:
    title: High-temperature water-gas shift
    model_basis: {kind: equilibrium}
    window: {temperature: [583.15, 773.15], pressure: [100, 8000]}
    reactions:
      - *wgs
    catalysts:
      - id: FE_CR
        name: Iron-chromium oxide
        active_phase: Fe3O4
        promoters: [Cr2O3, CuO]
        window: {temperature: [583.15, 773.15], pressure: [100, 8000]}
        poisons: [sulfur compounds, chlorides]
    sources: [*twigg]

  lt_shift:
    title: Low-temperature water-gas shift
    model_basis: {kind: equilibrium}
    window: {temperature: [463.15, 533.15], pressure: [100, 8000]}
    reactions:
      - *wgs
    catalysts:
      - id: CU_ZNO_LTS
        name: Copper-zinc oxide shift catalyst
        active_phase: Cu
        promoters: [ZnO, Al2O3]
        window: {temperature: [463.15, 533.15], pressure: [100, 8000]}
        poisons: [H2S, sulfur compounds, chlorides]
    sources: [*twigg]

  methanation:
    title: Methanation (syngas purification, substitute natural gas)
    model_basis: {kind: equilibrium}
    window: {temperature: [523.15, 723.15], pressure: [100, 8000]}
    reactions:
      - id: METH_CO
        equation: CO + 3 H2 <=> CH4 + H2O
        stoichiometry: {CO: -1, H2: -3, CH4: 1, H2O: 1}
        reversible: true
        heat_of_reaction: {value: -206100, provenance: given, source: "standard enthalpies of formation, 298 K"}
        catalyst: NI_METH
      - id: METH_CO2
        equation: CO2 + 4 H2 <=> CH4 + 2 H2O
        stoichiometry: {CO2: -1, H2: -4, CH4: 1, H2O: 2}
        reversible: true
        heat_of_reaction: {value: -165000, provenance: given, source: "standard enthalpies of formation, 298 K"}
        catalyst: NI_METH
    catalysts:
      - id: NI_METH
        name: Nickel methanation catalyst
        active_phase: Ni
        support: Al2O3
        window: {temperature: [523.15, 723.15], pressure: [100, 8000]}
        poisons: [H2S, sulfur compounds, chlorides]
    sources: [*twigg]

  ethylene_oxide:
    title: Ethylene oxide (direct oxidation)
    model_basis: {kind: stoichiometry_only}
    window: {temperature: [473.15, 573.15], pressure: [1000, 3000]}
    reactions:
      - id: EO_SYN
        equation: C2H4 + 1/2 O2 -> C2H4O
        stoichiometry: {C2H4: -1, O2: -0.5, EO: 1}
        catalyst: AG_EO
      - id: EO_BURN
        equation: C2H4 + 3 O2 -> 2 CO2 + 2 H2O
        stoichiometry: {C2H4: -1, O2: -3, CO2: 2, H2O: 2}
        catalyst: AG_EO
    catalysts:
      - id: AG_EO
        name: Silver on alpha-alumina
        active_phase: Ag
        promoters: [Cs, Re, chloride moderator]
        support: alpha-Al2O3
        window: {temperature: [473.15, 573.15], pressure: [1000, 3000]}
        poisons: [sulfur compounds, acetylene]
    sources: [*ullmann]

  sulfuric_acid:
    title: Sulfuric acid (contact process, SO2 oxidation)
    model_basis: {kind: equilibrium}
    window: {temperature: [663.15, 903.15], pressure: [100, 250]}
    reactions:
      - id: SO2_OX
        equation: SO2 + 1/2 O2 <=> SO3
        stoichiometry: {SO2: -1, O2: -0.5, SO3: 1}
        reversible: true
        heat_of_reaction: {value: -98900, provenance: given, source: "standard enthalpies of formation, 298 K"}
        catalyst: V2O5
    catalysts:
      - id: V2O5
        name: Vanadium pentoxide on silica
        active_phase: V2O5 in molten alkali pyrosulfate
        promoters: [K2SO4, Cs2SO4]
        support: SiO2 (diatomaceous earth)
        window: {temperature: [663.15, 903.15], pressure: [100, 250]}
        poisons: [arsenic, fluorides, chlorides]
    sources: [*ullmann]

  nitric_acid:
    title: Nitric acid (Ostwald process, ammonia oxidation)
    model_basis: {kind: stoichiometry_only}
    window: {temperature: [1073.15, 1223.15], pressure: [100, 1200]}
    reactions:
      - id: NH3_OX
        equation: 4 NH3 + 5 O2 -> 4 NO + 6 H2O
        stoichiometry: {NH3: -4, O2: -5, "NO": 4, H2O: 6}
        heat_of_reaction: {value: -905500, provenance: given, source: "standard enthalpies of formation, 298 K"}
        catalyst: PT_RH
      - id: NH3_TO_N2
        equation: 4 NH3 + 3 O2 -> 2 N2 + 6 H2O
        stoichiometry: {NH3: -4, O2: -3, N2: 2, H2O: 6}
        catalyst: PT_RH
      - id: NO_OX
        equation: 2 NO + O2 <=> 2 NO2
        stoichiometry: {"NO": -2, O2: -1, NO2: 2}
        reversible: true
        heat_of_reaction: {value: -114100, provenance: given, source: "standard enthalpies of formation, 298 K"}
    catalysts:
      - id: PT_RH
        name: Platinum-rhodium gauze
        active_phase: Pt-Rh (5-10 % Rh)
        window: {temperature: [1073.15, 1223.15], pressure: [100, 1200]}
        poisons: [iron oxide, phosphorus, sulfur compounds]
    sources: [*ullmann]

  claus:
    title: Claus sulfur recovery
    model_basis: {kind: stoichiometry_only}
    window: {temperature: [473.15, 1473.15], pressure: [100, 200]}
    reactions:
      - id: H2S_BURN
        equation: H2S + 3/2 O2 -> SO2 + H2O
        stoichiometry: {H2S: -1, O2: -1.5, SO2: 1, H2O: 1}
      - id: CLAUS
        title: Claus reaction (sulfur as S2, the thermal stage's form; the catalytic stages make S6 and S8)
        equation: 2 H2S + SO2 <=> 3/2 S2 + 2 H2O
        stoichiometry: {H2S: -2, SO2: -1, S2: 1.5, H2O: 2}
        reversible: true
        catalyst: AL2O3_CLAUS
    catalysts:
      - id: AL2O3_CLAUS
        name: Activated alumina (or titania) Claus catalyst
        active_phase: gamma-Al2O3
        window: {temperature: [473.15, 623.15], pressure: [100, 200]}
        poisons: [sulfation, carbon, ammonium salts]
    sources: [*ullmann]

  fischer_tropsch:
    title: Fischer-Tropsch synthesis (lumped, n-octane as the product)
    model_basis: {kind: stoichiometry_only}
    window: {temperature: [473.15, 623.15], pressure: [2000, 4000]}
    reactions:
      - id: FT
        title: Chain growth lumped to n-octane (no Anderson-Schulz-Flory distribution)
        equation: 8 CO + 17 H2 -> C8H18 + 8 H2O
        stoichiometry: {CO: -8, H2: -17, C8H18: 1, H2O: 8}
        catalyst: CO_FT
      - id: FT_METH
        equation: CO + 3 H2 -> CH4 + H2O
        stoichiometry: {CO: -1, H2: -3, CH4: 1, H2O: 1}
        catalyst: CO_FT
    catalysts:
      - id: CO_FT
        name: Cobalt on alumina (low-temperature FT)
        active_phase: Co
        promoters: [Pt, Re]
        support: Al2O3
        window: {temperature: [473.15, 513.15], pressure: [2000, 3000]}
        poisons: [sulfur compounds, NH3, HCN]
      - id: FE_FT
        name: Promoted iron (high-temperature FT)
        active_phase: Fe (carbides)
        promoters: [K2O, Cu]
        window: {temperature: [573.15, 623.15], pressure: [2000, 4000]}
        poisons: [sulfur compounds]
    sources: [*ullmann]

  hydrodesulfurization:
    title: Hydrodesulfurisation (thiophene as the sulfur compound)
    model_basis: {kind: stoichiometry_only}
    window: {temperature: [573.15, 673.15], pressure: [3000, 13000]}
    reactions:
      - id: HDS
        equation: C4H4S + 4 H2 -> C4H10 + H2S
        stoichiometry: {C4H4S: -1, H2: -4, C4H10: 1, H2S: 1}
        catalyst: COMO
    catalysts:
      - id: COMO
        name: Cobalt-molybdenum sulfide on alumina
        active_phase: MoS2 (Co-promoted)
        promoters: [Co]
        support: gamma-Al2O3
        window: {temperature: [573.15, 673.15], pressure: [3000, 13000]}
        poisons: [nitrogen compounds, metals (Ni, V), coke]
    sources: [*ullmann]

  styrene:
    title: Styrene (ethylbenzene dehydrogenation)
    model_basis: {kind: equilibrium}
    window: {temperature: [853.15, 923.15], pressure: [40, 150]}
    reactions:
      - id: EB_DH
        equation: C8H10 <=> C8H8 + H2
        stoichiometry: {EB: -1, STY: 1, H2: 1}
        reversible: true
        catalyst: FE_K
    catalysts:
      - id: FE_K
        name: Potassium-promoted iron oxide
        active_phase: Fe2O3 / KFeO2
        promoters: [K2O, Ce, Mo]
        window: {temperature: [853.15, 923.15], pressure: [40, 150]}
        poisons: [chlorides, coke (removed by steam)]
    sources: [*ullmann]

  acrylonitrile:
    title: Acrylonitrile (propylene ammoxidation, SOHIO)
    model_basis: {kind: stoichiometry_only}
    window: {temperature: [673.15, 773.15], pressure: [150, 300]}
    reactions:
      - id: AMMOX
        equation: C3H6 + NH3 + 3/2 O2 -> C3H3N + 3 H2O
        stoichiometry: {C3H6: -1, NH3: -1, O2: -1.5, ACN: 1, H2O: 3}
        catalyst: BIMO
    catalysts:
      - id: BIMO
        name: Multicomponent bismuth molybdate
        active_phase: Bi-Mo oxide
        promoters: [Fe, Co, Ni, K]
        support: SiO2 (fluidised bed)
        window: {temperature: [673.15, 773.15], pressure: [150, 300]}
        poisons: [molybdenum loss (makeup)]
    sources: [*ullmann]

  propylene_oxide:
    title: Propylene oxide (hydrogen peroxide route, HPPO)
    model_basis: {kind: stoichiometry_only}
    window: {temperature: [313.15, 333.15], pressure: [2000, 3000]}
    reactions:
      - id: HPPO
        equation: C3H6 + H2O2 -> C3H6O + H2O
        stoichiometry: {C3H6: -1, H2O2: -1, PO: 1, H2O: 1}
        phase: liquid
        catalyst: TS1
    catalysts:
      - id: TS1
        name: Titanium silicalite-1
        active_phase: Ti in MFI framework
        window: {temperature: [313.15, 333.15], pressure: [2000, 3000]}
        poisons: [bases, metal ions]
    sources: [*ullmann]

  ethane_cracking:
    title: Ethylene by steam cracking of ethane (molecular reactions, no catalyst)
    model_basis: {kind: stoichiometry_only}
    window: {temperature: [1073.15, 1173.15], pressure: [150, 250]}
    reactions:
      - id: C2H6_DH
        equation: C2H6 <=> C2H4 + H2
        stoichiometry: {C2H6: -1, C2H4: 1, H2: 1}
        reversible: true
      - id: C2H6_TO_C3
        equation: 2 C2H6 -> C3H8 + CH4
        stoichiometry: {C2H6: -2, C3H8: 1, CH4: 1}
    catalysts: []
    sources: [*ullmann]

  vinyl_chloride:
    title: Vinyl chloride (balanced EDC route)
    model_basis: {kind: stoichiometry_only}
    window: {temperature: [323.15, 823.15], pressure: [100, 3000]}
    reactions:
      - id: DIRECT_CL
        equation: C2H4 + Cl2 -> C2H4Cl2
        stoichiometry: {C2H4: -1, CL2: -1, EDC: 1}
        phase: liquid
      - id: OXYCHLOR
        equation: C2H4 + 2 HCl + 1/2 O2 -> C2H4Cl2 + H2O
        stoichiometry: {C2H4: -1, HCL: -2, O2: -0.5, EDC: 1, H2O: 1}
        catalyst: CUCL2
      - id: EDC_CRACK
        equation: C2H4Cl2 <=> C2H3Cl + HCl
        stoichiometry: {EDC: -1, VCM: 1, HCL: 1}
        reversible: true
    catalysts:
      - id: CUCL2
        name: Copper(II) chloride on alumina
        active_phase: CuCl2
        promoters: [KCl]
        support: gamma-Al2O3
        window: {temperature: [493.15, 573.15], pressure: [100, 600]}
        poisons: [iron, CuCl2 volatilisation]
    sources: [*ullmann]

  formaldehyde:
    title: Formaldehyde (methanol oxidation and dehydrogenation)
    model_basis: {kind: stoichiometry_only}
    window: {temperature: [523.15, 923.15], pressure: [100, 200]}
    reactions:
      - id: FORMOX
        equation: CH3OH + 1/2 O2 -> CH2O + H2O
        stoichiometry: {CH3OH: -1, O2: -0.5, HCHO: 1, H2O: 1}
        catalyst: FEMO
      - id: MEOH_DH
        equation: CH3OH <=> CH2O + H2
        stoichiometry: {CH3OH: -1, HCHO: 1, H2: 1}
        reversible: true
        catalyst: AG_FORM
    catalysts:
      - id: FEMO
        name: Iron molybdate (Formox)
        active_phase: Fe2(MoO4)3 with MoO3
        window: {temperature: [523.15, 673.15], pressure: [100, 200]}
        poisons: [molybdenum loss, iron carbonyl]
      - id: AG_FORM
        name: Silver crystals or gauze
        active_phase: Ag
        window: {temperature: [873.15, 923.15], pressure: [100, 200]}
        poisons: [sulfur compounds, halides]
    sources: [*ullmann]

  maleic_anhydride:
    title: Maleic anhydride (n-butane oxidation)
    model_basis: {kind: stoichiometry_only}
    window: {temperature: [653.15, 703.15], pressure: [100, 400]}
    reactions:
      - id: MA_SYN
        equation: C4H10 + 7/2 O2 -> C4H2O3 + 4 H2O
        stoichiometry: {C4H10: -1, O2: -3.5, MA: 1, H2O: 4}
        catalyst: VPO
      - id: C4_BURN
        equation: C4H10 + 13/2 O2 -> 4 CO2 + 5 H2O
        stoichiometry: {C4H10: -1, O2: -6.5, CO2: 4, H2O: 5}
        catalyst: VPO
    catalysts:
      - id: VPO
        name: Vanadyl pyrophosphate
        active_phase: (VO)2P2O7
        window: {temperature: [653.15, 703.15], pressure: [100, 400]}
        poisons: [phosphorus loss (dosed)]
    sources: [*ullmann]

  cumene:
    title: Cumene (benzene alkylation with propylene)
    model_basis: {kind: stoichiometry_only}
    window: {temperature: [393.15, 453.15], pressure: [2000, 4000]}
    reactions:
      - id: CUM_ALK
        equation: C6H6 + C3H6 -> C9H12
        stoichiometry: {BZ: -1, C3H6: -1, CUM: 1}
        phase: liquid
        catalyst: ZEO_ALK
    catalysts:
      - id: ZEO_ALK
        name: Zeolite (beta or MWW) alkylation catalyst
        active_phase: Bronsted acid sites
        window: {temperature: [393.15, 453.15], pressure: [2000, 4000]}
        poisons: [basic nitrogen compounds, water]
    sources: [*ullmann]

  ethylbenzene:
    title: Ethylbenzene (benzene alkylation with ethylene)
    model_basis: {kind: stoichiometry_only}
    window: {temperature: [473.15, 533.15], pressure: [2000, 4000]}
    reactions:
      - id: EB_ALK
        equation: C6H6 + C2H4 -> C8H10
        stoichiometry: {BZ: -1, C2H4: -1, EB: 1}
        phase: liquid
        catalyst: ZEO_EB
    catalysts:
      - id: ZEO_EB
        name: Zeolite alkylation catalyst
        active_phase: Bronsted acid sites
        window: {temperature: [473.15, 533.15], pressure: [2000, 4000]}
        poisons: [basic nitrogen compounds, water]
    sources: [*ullmann]

  mtbe:
    title: Methyl tert-butyl ether
    model_basis: {kind: stoichiometry_only}
    window: {temperature: [313.15, 363.15], pressure: [1000, 2000]}
    reactions:
      - id: MTBE_SYN
        equation: C4H8 + CH3OH <=> C5H12O
        stoichiometry: {IB: -1, CH3OH: -1, MTBE: 1}
        reversible: true
        phase: liquid
        catalyst: RESIN
    catalysts:
      - id: RESIN
        name: Sulfonic acid ion-exchange resin
        active_phase: sulfonic acid groups
